<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="/src/CSS/style.css" />
        <link rel="stylesheet" href="/src/CSS/settings.css" />
        <link rel="stylesheet" href="/src/CSS/shop.css" />
        <link rel="stylesheet" href="/src/CSS/hotbar.css" />
        <link rel="stylesheet" href="/src/CSS/storage.css" />
        <link rel="stylesheet" href="/src/CSS/money.css" />
        <link rel="stylesheet" href="/src/CSS/radial_menu.css" />
        <link rel="stylesheet" href="/src/CSS/toast.css" />
        <link rel="stylesheet" href="/src/CSS/effects.css" />
        <link rel="stylesheet" href="/src/CSS/level.css" />

        <link
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
            rel="stylesheet"
        />
        <title>greenvale</title>
    </head>
    <body>
        <div id="app">
            <div id="game-container"></div>
            <div id="ui-layer">
                <button class="settings-btn hidden" id="btnDefinicoes">
                    <img
                        src="assets/images/Button_Settings.png"
                        alt="Definições"
                        class="settings-icon-img"
                    />
                </button>
                <div id="settings-menu" class="hidden">
                    <div class="panel">
                        <button class="btn-close" id="close-settings">✕</button>
                        <h1 class="panel-title" data-i18n="ui.settings"></h1>

                        <div class="section">
                            <span
                                class="section-label"
                                data-i18n="ui.language"
                            ></span>
                            <div class="lang-group">
                                <button class="lang-btn active" data-lang="pt">
                                    🇵🇹 Português
                                </button>
                                <button class="lang-btn" data-lang="en">
                                    🇬🇧 English
                                </button>
                                <button class="lang-btn" data-lang="es">
                                    🇪🇸 Español
                                </button>
                            </div>
                        </div>

                        <hr class="divider" />

                        <div class="section">
                            <span
                                class="section-label"
                                data-i18n="ui.controls"
                            ></span>
                            <div class="controls-group">
                                <div
                                    class="control-card active"
                                    data-control="arrows"
                                >
                                    <span
                                        class="material-symbols-outlined control-icon"
                                        >keyboard_double_arrow_up</span
                                    >
                                    <div
                                        class="keys-label"
                                        data-i18n="ui.arrows"
                                    ></div>
                                </div>

                                <div class="control-card" data-control="wasd">
                                    <span
                                        class="material-symbols-outlined control-icon"
                                        >keyboard</span
                                    >
                                    <div class="keys-label">WASD</div>
                                </div>
                            </div>
                        </div>

                        <hr class="divider" />

                        <div class="section">
                            <span
                                class="section-label"
                                data-i18n="ui.audio"
                            ></span>
                            <div class="toggle-row">
                                <span data-i18n="ui.music"></span>
                                <label class="toggle">
                                    <input
                                        type="checkbox"
                                        id="toggle-music"
                                        checked
                                    />
                                    <div class="toggle-track"></div>
                                </label>
                            </div>
                            <div class="toggle-row">
                                <span data-i18n="ui.sounds"></span>
                                <label class="toggle">
                                    <input type="checkbox" id="toggle-sounds" />
                                    <div class="toggle-track"></div>
                                </label>
                            </div>
                        </div>

                        <hr class="divider" />

                        <div class="section">
                            <span
                                class="section-label"
                                data-i18n="ui.character"
                            ></span>
                            <div class="skin-group">
                                <div
                                    class="skin-card active"
                                    data-skin="skin_a"
                                >
                                    <img
                                        src="assets/images/players/player_walk1_skin_a.png"
                                        alt="Skin A"
                                        class="skin-preview"
                                    />
                                    <div
                                        class="skin-label"
                                        data-i18n="ui.classic"
                                    ></div>
                                </div>
                                <div class="skin-card" data-skin="skin_b">
                                    <img
                                        src="assets/images/players/player_walk1_skin_b.png"
                                        alt="Skin B"
                                        class="skin-preview"
                                    />
                                    <div
                                        class="skin-label"
                                        data-i18n="ui.blue"
                                    ></div>
                                </div>
                                <div class="skin-card" data-skin="skin_c">
                                    <img
                                        src="assets/images/players/player_walk1_skin_c.png"
                                        alt="Skin C"
                                        class="skin-preview"
                                    />
                                    <div
                                        class="skin-label"
                                        data-i18n="ui.red"
                                    ></div>
                                </div>
                                <div class="skin-card" data-skin="skin_d">
                                    <img
                                        src="assets/images/players/player_walk1_skin_d.png"
                                        alt="Skin D"
                                        class="skin-preview"
                                    />
                                    <div
                                        class="skin-label"
                                        data-i18n="ui.purple"
                                    ></div>
                                </div>
                            </div>
                        </div>

                        <hr class="divider" />

                        <div class="section">
                            <span
                                class="section-label"
                                data-i18n="ui.screen"
                            ></span>
                            <div class="toggle-row">
                                <span data-i18n="ui.fullscreen"></span>
                                <label class="toggle">
                                    <input
                                        type="checkbox"
                                        id="toggle-fullscreen"
                                        checked="false"
                                    />
                                    <div class="toggle-track"></div>
                                </label>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- ======================================== HOTBAR ======================================== -->
                <div class="hotbar-container hidden" id="hotbar-container">
                    <div class="slot active" data-slot="0">
                        <span class="hotkey">1</span>
                    </div>
                    <div class="slot" data-slot="1">
                        <span class="hotkey">2</span>
                    </div>
                    <div class="slot" data-slot="2">
                        <span class="hotkey">3</span>
                    </div>
                    <div class="slot" data-slot="3">
                        <span class="hotkey">4</span>
                    </div>
                    <div class="slot" data-slot="4">
                        <span class="hotkey">5</span>
                    </div>
                    <div class="slot" data-slot="5">
                        <span class="hotkey">6</span>
                    </div>
                    <div class="slot" data-slot="6">
                        <span class="hotkey">7</span>
                    </div>
                    <div class="slot" data-slot="7">
                        <span class="hotkey">8</span>
                    </div>
                    <div class="separator"></div>
                    <div class="inventory-btn" id="btnInventario">
                        <span class="hotkey">E</span>
                        <img
                            src="assets/images/Mochila.png"
                            alt="Mochila"
                            class="bag-img"
                        />
                    </div>
                </div>

                <div id="item-tooltip" class="tooltip hidden">
                    <div class="tooltip-title"></div>
                    <div class="tooltip-desc"></div>
                </div>

                <div id="inventory-overlay" class="hidden">
                    <div class="inventory-panel">
                        <div class="inventory-header">
                            <h2>Mochila</h2>
                            <button class="btn-close" id="close-inventory">
                                ✕
                            </button>
                        </div>

                        <div class="inventory-grid">
                            <div class="slot" data-slot="8">
                                <span class="hotkey">9</span>
                            </div>
                            <div class="slot" data-slot="9">
                                <span class="hotkey">10</span>
                            </div>
                            <div class="slot" data-slot="10">
                                <span class="hotkey">11</span>
                            </div>
                            <div class="slot" data-slot="11">
                                <span class="hotkey">12</span>

                                <span class="hotkey">13</span>

                            <div class="slot" data-slot="14">
                                <span class="hotkey">15</span>
                            </div>
                            <div class="slot" data-slot="15">
                                <span class="hotkey">16</span>
                            </div>
                            <div class="slot" data-slot="16">
                                <span class="hotkey">17</span>
                            </div>
                            <div class="slot" data-slot="17">
                                <span class="hotkey">18</span>
                            </div>
                            <div class="slot" data-slot="18">
                                <span class="hotkey">19</span>
                            </div>
                            <div class="slot" data-slot="19">
                                <span class="hotkey">20</span>
                            </div>
                            <div class="slot" data-slot="20">
                                <span class="hotkey">21</span>
                            </div>
                            <div class="slot" data-slot="21">
                                <span class="hotkey">22</span>
                            </div>
                            <div class="slot" data-slot="22">
                                <span class="hotkey">23</span>
                            </div>
                            <div class="slot" data-slot="23">
                                <span class="hotkey">24</span>
                            </div>
                            <div class="slot" data-slot="24">
                                <span class="hotkey">25</span>
                            </div>
                            <div class="slot" data-slot="25">
                                <span class="hotkey">26</span>
                            </div>
                            <div class="slot" data-slot="26">
                                <span class="hotkey">27</span>
                            </div>
                            <div class="slot" data-slot="27">
                                <span class="hotkey">28</span>
                            </div>
                        </div>

                        <div class="hotbar-inside-inventory">
                            <div class="slot" data-slot="0">
                                <span class="hotkey">1</span>
                            </div>
                            <div class="slot" data-slot="1">
                                <span class="hotkey">2</span>
                            </div>
                            <div class="slot" data-slot="2">
                                <span class="hotkey">3</span>
                            </div>
                            <div class="slot" data-slot="3">
                                <span class="hotkey">4</span>
                            </div>
                            <div class="slot" data-slot="4">
                                <span class="hotkey">5</span>
                            </div>
                            <div class="slot" data-slot="5">
                                <span class="hotkey">6</span>
                            </div>
                            <div class="slot" data-slot="6">
                                <span class="hotkey">7</span>
                            </div>
                            <div class="slot" data-slot="7">
                                <span class="hotkey">8</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div id="shop-overlay" class="hidden">
                <div class="shop-panel">
                    <div class="shop-header">
                        <h2 id="shop-title">Loja</h2>
                        <button id="shop-close" class="shop-close-btn">
                            ✕
                        </button>
                    </div>
                    <div id="shop-items" class="shop-items-container"></div>
                </div>
            </div>

            <div id="zone-tooltip" class="hidden">
                Pressiona F para interagir
            </div>

            <div id="storage-overlay" class="hidden ui-overlay">
                <div class="ui-panel storage-panel">
                    <div class="ui-header">
                        <h2>Armazém</h2>
                        <button id="storage-close">X</button>
                    </div>

                    <div class="ui-content">
                        <div class="ui-section">
                            <h3>Inventário</h3>

                            <div id="inventory-grid" class="grid">
                                <div class="slot" data-slot="0"></div>
                                <div class="slot" data-slot="1"></div>
                                <div class="slot" data-slot="2"></div>
                                <div class="slot" data-slot="3"></div>
                                <div class="slot" data-slot="4"></div>
                                <div class="slot" data-slot="5"></div>
                                <div class="slot" data-slot="6"></div>
                                <div class="slot" data-slot="7"></div>

                                <div class="slot" data-slot="10"></div>
                                <div class="slot" data-slot="11"></div>

                                <div class="slot" data-slot="13"></div>
                                <div class="slot" data-slot="14"></div>
                                <div class="slot" data-slot="15"></div>
                                <div class="slot" data-slot="16"></div>
                                <div class="slot" data-slot="17"></div>
                                <div class="slot" data-slot="18"></div>
                                <div class="slot" data-slot="19"></div>
                                <div class="slot" data-slot="20"></div>
                                <div class="slot" data-slot="21"></div>
                                <div class="slot" data-slot="22"></div>
                                <div class="slot" data-slot="23"></div>
                                <div class="slot" data-slot="24"></div>
                                <div class="slot" data-slot="25"></div>
                                <div class="slot" data-slot="26"></div>
                                <div class="slot" data-slot="27"></div>
                            </div>
                        </div>
                        <div class="ui-section">
                            <h3>Armazém</h3>

                            <div id="storage-grid" class="grid">
                                <div class="slot" data-slot="0"></div>
                                <div class="slot" data-slot="1"></div>
                                <div class="slot" data-slot="2"></div>
                                <div class="slot" data-slot="3"></div>
                                <div class="slot" data-slot="4"></div>
                                <div class="slot" data-slot="5"></div>
                                <div class="slot" data-slot="6"></div>
                                <div class="slot" data-slot="7"></div>

                                <div class="slot" data-slot="28"></div>
                                <div class="slot" data-slot="29"></div>
                                <div class="slot" data-slot="30"></div>
                                <div class="slot" data-slot="31"></div>
                                <div class="slot" data-slot="32"></div>
                                <div class="slot" data-slot="33"></div>
                                <div class="slot" data-slot="34"></div>
                                <div class="slot" data-slot="35"></div>
                                <div class="slot" data-slot="36"></div>
                                <div class="slot" data-slot="37"></div>
                                <div class="slot" data-slot="38"></div>
                                <div class="slot" data-slot="39"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div id="radial-overlay" class="hidden">
                <ul id="effect-radial-menu"></ul>
            </div>

            <div id="active-effects-panel" class="effects-collapsed hidden">
                <div id="active-effects-list"></div>
            </div>
            <div id="toast" class="toast hidden"></div>

            <div class="money-hud hidden" id="money-hud">
                <div class="money-item">
                    <img
                        src="assets/images/Coin.png"
                        alt="Moedas"
                        class="money-icon"
                    />
                    <span id="coins">0</span>
                </div>
                <div class="money-item">
                    <img
                        src="assets/images/Boss_Coin.png"
                        alt="Tokens"
                        class="money-icon"
                    />
                    <span id="bossTokens">0</span>
                </div>
            </div>

            <div id="farm-level-hud" class="farm-level-hud hidden">
                <div class="farm-level-header">
                    <span class="farm-icon">🌾</span>
                    <span id="farm-level-text">Farm Lv. 1</span>
                </div>

                <div class="farm-xp-bar">
                    <div id="farm-xp-fill" class="farm-xp-fill"></div>
                </div>

                <div id="farm-xp-text" class="farm-xp-text">0 / 100 XP</div>
            </div>
            <!-- ======================================== Aqui acaba a UI-LAYER ======================================== -->
        </div>

        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
