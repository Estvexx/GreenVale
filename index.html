<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="/src/CSS/style.css" />
        <link rel="stylesheet" href="/src/CSS/settings.css" />
        <link
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
            rel="stylesheet"
        />
        <title>greenvale</title>
    </head>
    <body>
        <div id="app">
            <div id="game-container"></div>

            <div id="settings-menu" class="hidden">
                <div class="panel">
                    <button class="btn-close" id="close-settings">✕</button>
                    <h1 class="panel-title" data-i18n="ui.settings"></h1>

                    <div class="section">
                        <span
                            class="section-label"
                            data-i18n="ui.language"
                        ></span>
                        <div class="lang-group">
                            <button
                                class="lang-btn active"
                                onclick="setLang(this, 'pt')"
                            >
                                🇵🇹 Português
                            </button>
                            <button
                                class="lang-btn"
                                onclick="setLang(this, 'en')"
                            >
                                🇬🇧 English
                            </button>
                            <button
                                class="lang-btn"
                                onclick="setLang(this, 'es')"
                            >
                                🇪🇸 Español
                            </button>
                        </div>
                    </div>

                    <hr class="divider" />

                    <div class="section">
                        <span
                            class="section-label"
                            data-i18n="ui.controls"
                        ></span>
                        <div class="controls-group">
                            <div
                                class="control-card active"
                                data-control="arrows"
                                onclick="setControlKeys(this)"
                            >
                                <span
                                    class="material-symbols-outlined control-icon"
                                    >keyboard_double_arrow_up</span
                                >
                                <div class="keys-label" data-i18n="ui.arrows"></div>
                            </div>

                            <div
                                class="control-card"
                                data-control="wasd"
                                onclick="setControlKeys(this)"
                            >
                                <span
                                    class="material-symbols-outlined control-icon"
                                    >keyboard</span
                                >
                                <div class="keys-label">WASD</div>
                            </div>
                        </div>
                    </div>

                    <hr class="divider" />

                    <div class="section">
                        <span class="section-label" data-i18n="ui.audio"></span>
                        <div class="toggle-row">
                            <span data-i18n="ui.music"></span>
                            <label class="toggle">
                                <input
                                    type="checkbox"
                                    id="toggle-music"
                                    checked
                                />
                                <div class="toggle-track"></div>
                            </label>
                        </div>
                        <div class="toggle-row">
                            <span data-i18n="ui.sounds"></span>
                            <label class="toggle">
                                <input type="checkbox" id="toggle-sounds" />
                                <div class="toggle-track"></div>
                            </label>
                        </div>
                    </div>

                    <hr class="divider" />

                    <div class="section">
                        <span
                            class="section-label"
                            data-i18n="ui.character"
                        ></span>
                        <div class="skin-group">
                            <div
                                class="skin-card active"
                                onclick="setSkin(this, 'skin_a')"
                            >
                                <img
                                    src="assets/images/players/player_walk1_skin_a.png"
                                    alt="Skin A"
                                    class="skin-preview"
                                />
                                <div
                                    class="skin-label"
                                    data-i18n="ui.classic"
                                ></div>
                            </div>
                            <div
                                class="skin-card"
                                onclick="setSkin(this, 'skin_b')"
                            >
                                <img
                                    src="assets/images/players/player_walk1_skin_b.png"
                                    alt="Skin B"
                                    class="skin-preview"
                                />
                                <div
                                    class="skin-label"
                                    data-i18n="ui.blue"
                                ></div>
                            </div>
                            <div
                                class="skin-card"
                                onclick="setSkin(this, 'skin_c')"
                            >
                                <img
                                    src="assets/images/players/player_walk1_skin_c.png"
                                    alt="Skin C"
                                    class="skin-preview"
                                />
                                <div
                                    class="skin-label"
                                    data-i18n="ui.red"
                                ></div>
                            </div>
                            <div
                                class="skin-card"
                                onclick="setSkin(this, 'skin_d')"
                            >
                                <img
                                    src="assets/images/players/player_walk1_skin_d.png"
                                    alt="Skin D"
                                    class="skin-preview"
                                />
                                <div
                                    class="skin-label"
                                    data-i18n="ui.purple"
                                ></div>
                            </div>
                        </div>
                    </div>

                    <hr class="divider" />

                    <div class="section">
                        <span
                            class="section-label"
                            data-i18n="ui.screen"
                        ></span>
                        <div class="toggle-row">
                            <span data-i18n="ui.fullscreen"></span>
                            <label class="toggle">
                                <input
                                    type="checkbox"
                                    id="toggle-fullscreen"
                                    checked="false"
                                />
                                <div class="toggle-track"></div>
                            </label>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script type="module" src="/src/main.ts"></script>
        <script>
            function setLang(btn, lang) {
                document
                    .querySelectorAll(".lang-btn")
                    .forEach((b) => b.classList.remove("active"));
                btn.classList.add("active");

                import("/src/i18n/index.ts").then(({ setLanguage }) => {
                    setLanguage(lang);
                });
            }

            function setControlKeys(card) {
                document
                    .querySelectorAll(".control-card")
                    .forEach((c) => c.classList.remove("active"));

                card.classList.add("active");
                // Aqui eu pego o valor do diretamente do atributo data-control do card clicado
                const scheme = card.dataset.control;

                localStorage.setItem("controlScheme", scheme);
            }

            function setSkin(card, skinKey) {
                document
                    .querySelectorAll(".skin-card")
                    .forEach((c) => c.classList.remove("active"));
                card.classList.add("active");
                localStorage.setItem("playerSkin", skinKey);
            }

            // Ao abrir a página, marca a skin guardada como ativa
            window.addEventListener("DOMContentLoaded", () => {
                const saved = localStorage.getItem("controlScheme") || "wasd";

                document.querySelectorAll(".control-card").forEach((card) => {
                    const scheme = card.dataset.control;

                    if (scheme === saved) {
                        card.classList.add("active");
                    } else {
                        card.classList.remove("active");
                    }
                });

                const savedSkin = localStorage.getItem("playerSkin");
                if (savedSkin) {
                    document.querySelectorAll(".skin-card").forEach((card) => {
                        if (card.getAttribute("onclick")?.includes(savedSkin)) {
                            card.classList.add("active");
                        } else {
                            card.classList.remove("active");
                        }
                    });
                }
            });

            // Sincroniza sempre, independente das settings estarem abertas
            document.addEventListener("fullscreenchange", () => {
                const checkbox = document.getElementById("toggle-fullscreen");
                if (checkbox) checkbox.checked = !!document.fullscreenElement;
            });

            // Fullscreen toggle — só age quando o utilizador clica
            document
                .getElementById("toggle-fullscreen")
                ?.addEventListener("change", (e) => {
                    if (e.target.checked) {
                        document.documentElement.requestFullscreen();
                    } else {
                        document.exitFullscreen();
                    }
                });
        </script>
    </body>
</html>
