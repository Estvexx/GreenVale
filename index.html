<!doctype html>

<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="/src/CSS/style.css" />
        <link rel="stylesheet" href="/src/CSS/settings.css" />
        <title>greenvale</title>
    </head>
    <body>
        <div id="app">
            <div id="game-container">
                <div id="settings-menu" class="hidden">
                <div class="settings-panel">
                    <h2>Definições</h2>
                    
                    <label>Música
                    <input type="range" id="music-volume" min="0" max="100" value="80">
                    </label>

                    <label>Sons
                    <input type="range" id="sfx-volume" min="0" max="100" value="100">
                    </label>

                    <label>Fullscreen
                    <input type="checkbox" id="fullscreen-toggle">
                    </label>

                    <button id="close-settings">Fechar</button>
                </div>
            </div>
        </div>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
