<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="/src/CSS/style.css" />
        <link rel="stylesheet" href="/src/CSS/settings.css" />
        <link rel="stylesheet" href="/src/CSS/shop.css" />
        <link rel="stylesheet" href="/src/CSS/hotbar.css" />
        <link
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
            rel="stylesheet"
        />
        <title>greenvale</title>
    </head>
    <body>
        <div id="app">
            <div id="game-container"></div>
            <div id="ui-layer">
                <button class="settings-btn" id="btnDefinicoes">
                    <img
                        src="assets/images/Button_Settings.png"
                        alt="Definições"
                        class="settings-icon-img"
                    />
                </button>
                <div id="settings-menu" class="hidden">
                    <div class="panel">
                        <button class="btn-close" id="close-settings">✕</button>
                        <h1 class="panel-title" data-i18n="ui.settings"></h1>

                        <div class="section">
                            <span
                                class="section-label"
                                data-i18n="ui.language"
                            ></span>
                            <div class="lang-group">
                                <button class="lang-btn active" data-lang="pt">
                                    🇵🇹 Português
                                </button>
                                <button class="lang-btn" data-lang="en">
                                    🇬🇧 English
                                </button>
                                <button class="lang-btn" data-lang="es">
                                    🇪🇸 Español
                                </button>
                            </div>
                        </div>

                        <hr class="divider" />

                        <div class="section">
                            <span
                                class="section-label"
                                data-i18n="ui.controls"
                            ></span>
                            <div class="controls-group">
                                <div
                                    class="control-card active"
                                    data-control="arrows"
                                >
                                    <span
                                        class="material-symbols-outlined control-icon"
                                        >keyboard_double_arrow_up</span
                                    >
                                    <div
                                        class="keys-label"
                                        data-i18n="ui.arrows"
                                    ></div>
                                </div>

                                <div class="control-card" data-control="wasd">
                                    <span
                                        class="material-symbols-outlined control-icon"
                                        >keyboard</span
                                    >
                                    <div class="keys-label">WASD</div>
                                </div>
                            </div>
                        </div>

                        <hr class="divider" />

                        <div class="section">
                            <span
                                class="section-label"
                                data-i18n="ui.audio"
                            ></span>
                            <div class="toggle-row">
                                <span data-i18n="ui.music"></span>
                                <label class="toggle">
                                    <input
                                        type="checkbox"
                                        id="toggle-music"
                                        checked
                                    />
                                    <div class="toggle-track"></div>
                                </label>
                            </div>
                            <div class="toggle-row">
                                <span data-i18n="ui.sounds"></span>
                                <label class="toggle">
                                    <input type="checkbox" id="toggle-sounds" />
                                    <div class="toggle-track"></div>
                                </label>
                            </div>
                        </div>

                        <hr class="divider" />

                        <div class="section">
                            <span
                                class="section-label"
                                data-i18n="ui.character"
                            ></span>
                            <div class="skin-group">
                                <div
                                    class="skin-card active"
                                    data-skin="skin_a"
                                >
                                    <img
                                        src="assets/images/players/player_walk1_skin_a.png"
                                        alt="Skin A"
                                        class="skin-preview"
                                    />
                                    <div
                                        class="skin-label"
                                        data-i18n="ui.classic"
                                    ></div>
                                </div>
                                <div class="skin-card" data-skin="skin_b">
                                    <img
                                        src="assets/images/players/player_walk1_skin_b.png"
                                        alt="Skin B"
                                        class="skin-preview"
                                    />
                                    <div
                                        class="skin-label"
                                        data-i18n="ui.blue"
                                    ></div>
                                </div>
                                <div class="skin-card" data-skin="skin_c">
                                    <img
                                        src="assets/images/players/player_walk1_skin_c.png"
                                        alt="Skin C"
                                        class="skin-preview"
                                    />
                                    <div
                                        class="skin-label"
                                        data-i18n="ui.red"
                                    ></div>
                                </div>
                                <div class="skin-card" data-skin="skin_d">
                                    <img
                                        src="assets/images/players/player_walk1_skin_d.png"
                                        alt="Skin D"
                                        class="skin-preview"
                                    />
                                    <div
                                        class="skin-label"
                                        data-i18n="ui.purple"
                                    ></div>
                                </div>
                            </div>
                        </div>

                        <hr class="divider" />

                        <div class="section">
                            <span
                                class="section-label"
                                data-i18n="ui.screen"
                            ></span>
                            <div class="toggle-row">
                                <span data-i18n="ui.fullscreen"></span>
                                <label class="toggle">
                                    <input
                                        type="checkbox"
                                        id="toggle-fullscreen"
                                        checked="false"
                                    />
                                    <div class="toggle-track"></div>
                                </label>
                            </div>
                        </div>
                    </div>
                </div>

                <div id="shop-ferragens" class="shop hidden">
                    <div class="shop-panel">
                        <button
                            class="btn-close"
                            onclick="closeShop('ferragens')"
                        >
                            ✕
                        </button>
                        <h2 class="shop-title">🔨 Loja de Ferragens</h2>
                        <p class="shop-balance">
                            🪙 <span class="balance-amount"></span>
                        </p>
                        <div class="shop-grid" id="grid-ferragens"></div>
                    </div>
                </div>

                <div id="shop-sementes" class="shop hidden">
                    <div class="shop-panel">
                        <button
                            class="btn-close"
                            onclick="closeShop('sementes')"
                        >
                            ✕
                        </button>
                        <h2 class="shop-title">🌱 Loja de Sementes</h2>
                        <p class="shop-balance">
                            🪙 <span class="balance-amount"></span>
                        </p>
                        <div class="shop-grid" id="grid-sementes"></div>
                    </div>
                </div>

                <div id="shop-mercado" class="shop hidden">
                    <div class="shop-panel">
                        <button
                            class="btn-close"
                            onclick="closeShop('mercado')"
                        >
                            ✕
                        </button>
                        <h2 class="shop-title">🏪 Mercado</h2>
                        <p class="shop-balance">
                            🪙 <span class="balance-amount"></span>
                        </p>
                        <div class="shop-grid" id="grid-mercado"></div>
                    </div>
                </div>

                <!-- ======================================== HOTBAR ======================================== -->
                <div class="hotbar-container">
                    <div class="slot active" data-slot="1">
                        <span class="hotkey">1</span>
                    </div>
                    <div class="slot" data-slot="2">
                        <span class="hotkey">2</span>
                    </div>
                    <div class="slot" data-slot="3">
                        <span class="hotkey">3</span>
                    </div>
                    <div class="slot" data-slot="4">
                        <span class="hotkey">4</span>
                    </div>
                    <div class="slot" data-slot="5">
                        <span class="hotkey">5</span>
                    </div>
                    <div class="slot" data-slot="6">
                        <span class="hotkey">6</span>
                    </div>
                    <div class="slot" data-slot="7">
                        <span class="hotkey">7</span>
                    </div>
                    <div class="slot" data-slot="8">
                        <span class="hotkey">8</span>
                    </div>
                    <div class="separator"></div>
                    <div class="inventory-btn" id="btnInventario">
                        <span class="hotkey">E</span>
                        <img
                            src="assets/images/Mochila.png"
                            alt="Mochila"
                            class="bag-img"
                        />
                    </div>
                </div>
            </div>
        </div>

        <script type="module" src="/src/main.ts"></script>
        <script>
            // ================================ LOJAS ========================================
            function openShop(type) {
                const balance = localStorage.getItem("balance") || "100";
                document
                    .querySelectorAll(".balance-amount")
                    .forEach((el) => (el.textContent = balance));

                const grid = document.getElementById(`grid-${type}`);
                grid.innerHTML = "";

                import("/src/shops/ShopData.ts").then(({ SHOP_DATA }) => {
                    const items = SHOP_DATA[type];
                    const isMercado = type === "mercado";

                    items.forEach((item) => {
                        const btnAction = isMercado
                            ? `sellItem('${item.id}', ${item.price})`
                            : `buyItem('${item.id}', '${type}')`;

                        grid.innerHTML += `
                                            <div class="shop-item">
                                                <img src="assets/images/tools/${item.icon}.png" alt="${item.name}">
                                                <span class="shop-item-name">${item.name}</span>
                                                <span class="shop-item-price">🪙 ${item.price}</span>
                                                <button class="shop-item-btn" onclick="${btnAction}" ${item.isActive ? "" : "disabled"}>
                                                    ${isMercado ? "Vender" : item.isActive ? "Comprar" : "Obtido"}
                                                </button>
                                            </div>
                                        `;
                    });
                });
            }

            function closeShop(type) {
                document
                    .getElementById(`shop-${type}`)
                    ?.classList.add("hidden");
            }

            function buyItem(id, shopType) {
                window.buyItem(id, shopType);
            }
            function sellItem(id, price) {
                window.sellItem(id, price);
            }
        </script>
    </body>
</html>
