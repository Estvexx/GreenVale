<main id="main-menu" class="main-menu">
    <div class="main-menu__content">
        <div class="main-menu__logo-wrap">
            <img
                class="main-menu__logo"
                src="assets/images/BootImage.png"
                alt="GreenVale"
            />
            <span id="main-menu-splash" class="main-menu__splash"></span>
        </div>

        <div class="main-menu__actions">
            <button id="main-menu-play" class="main-menu__button" data-i18n="mainMenu.play"></button>

            <button id="main-menu-new-game" class="main-menu__button" data-i18n="mainMenu.newGame"></button>

            <button id="main-menu-import" class="main-menu__button" data-i18n="mainMenu.import"></button>

            <label class="main-menu__button main-menu__button--file">
                <span data-i18n="mainMenu.chooseFile"></span>
                <input
                    id="main-menu-import-input"
                    type="file"
                    accept=".json,application/json"
                />
            </label>

            <button
                id="main-menu-exit"
                class="main-menu__button main-menu__button--exit"
                data-i18n="mainMenu.exit"
            ></button>
        </div>
    </div>
</main>
