<main id="main-menu" class="main-menu">
    <div class="main-menu__content">
        <img
            class="main-menu__logo"
            src="assets/images/BootImage.png"
            alt="GreenVale"
        />

        <div class="main-menu__actions">
            <button id="main-menu-play" class="main-menu__button">
                Jogar / Continuar
            </button>

            <label class="main-menu__button main-menu__button--file">
                Upload JSON
                <input id="main-menu-upload" type="file" accept=".json,application/json" />
            </label>

            <button id="main-menu-exit" class="main-menu__button main-menu__button--exit">
                Sair do jogo
            </button>
        </div>
    </div>
</main>
